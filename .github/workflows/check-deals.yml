name: Steam Deal Notifier

on:
  schedule:
    # Her 3 saatte bir çalışır (UTC saatine göre). Sıklığı burada değiştirebilirsin.
    - cron: "0 */3 * * *"
  workflow_dispatch: {} # Manuel "Run workflow" butonuyla da tetikleyebilirsin

permissions:
  contents: write # posted.json state dosyasını repoya geri commit edebilmek için

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bağımlılıkları yükle
        run: npm install

      - name: Botu çalıştır
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          MIN_DISCOUNT_PERCENT: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm start

      - name: Haber verilen oyunların listesini (state) geri kaydet
        run: |
          git config user.name "steam-deal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/posted.json
          git diff --quiet && git diff --staged --quiet || git commit -m "state güncellendi"
          git push
